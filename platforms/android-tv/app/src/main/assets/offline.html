<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curato</title>
    <style>
      html { font-size: 0.8333vw; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0d12; color: #f4f6fb; font-family: Roboto, sans-serif; text-align: center; }
      h1 { font-size: 2.6rem; margin: 0 0 1rem; }
      p { font-size: 1.4rem; color: #9aa3b5; max-width: 50rem; }
      button { margin-top: 2rem; font-size: 1.4rem; font-weight: 600; padding: 0.9rem 2.2rem; border-radius: 999px; border: 0; background: #fff; color: #0b0d12; }
    </style>
  </head>
  <body>
    <h1>No internet connection</h1>
    <p>Curato needs the internet to load your videos. Check the TV’s network settings, then try again.</p>
    <button id="retry" autofocus>Try again</button>
    <script>
      var retry = document.getElementById('retry');
      retry.focus();
      retry.addEventListener('click', function () {
        if (window.CuratoNative && window.CuratoNative.reload) window.CuratoNative.reload();
      });
      window.__curatoBack = function () {
        if (window.CuratoNative) window.CuratoNative.exit();
      };
    </script>
  </body>
</html>
