<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curato</title>
    <!--
      Packaged launcher for Samsung (Tizen) and LG (webOS).
      It opens the hosted Curato TV app at __APP_URL__ so that:
        - the YouTube embed runs on a real https origin (embeds without one fail with player errors 152/153),
        - TV UI updates ship instantly without a new store review.
      When the TV is offline it shows a retry screen instead of a blank page.
    -->
    <style>
      html { font-size: 0.8333vw; }
      body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: #0b0d12; color: #f4f6fb; font-family: 'Samsung One', 'LG Smart UI', Roboto, sans-serif; text-align: center; }
      .brand { font-size: 3rem; font-weight: 800; color: #a5b0ff; letter-spacing: 0.04em; }
      h1 { font-size: 2.4rem; margin: 2rem 0 1rem; }
      p { font-size: 1.4rem; color: #9aa3b5; max-width: 52rem; line-height: 1.5; }
      button { margin-top: 2rem; font-size: 1.4rem; font-weight: 600; padding: 0.9rem 2.2rem; border-radius: 999px; border: 0; background: #fff; color: #0b0d12; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="brand">Curato</div>
    <div id="offline" class="hidden">
      <h1>No internet connection</h1>
      <p>Curato needs the internet to load your videos. Check the TV’s network settings, then press OK to try again.</p>
      <button id="retry">Try again</button>
    </div>
    <script>
      (function () {
        var APP_URL = '__APP_URL__';
        var PLATFORM = '__PLATFORM__';
        var offline = document.getElementById('offline');
        var retry = document.getElementById('retry');

        function exit() {
          try {
            if (window.tizen && tizen.application) return tizen.application.getCurrentApplication().exit();
          } catch (e) {}
          try {
            if (window.webOS && window.webOS.platformBack) return window.webOS.platformBack();
          } catch (e) {}
          window.close();
        }

        function go() {
          if (navigator.onLine === false) {
            offline.className = '';
            retry.focus();
            return;
          }
          var sep = APP_URL.indexOf('?') === -1 ? '?' : '&';
          window.location.replace(APP_URL + sep + 'platform=' + PLATFORM);
        }

        retry.addEventListener('click', go);
        document.addEventListener('keydown', function (e) {
          if (e.keyCode === 10009 || e.keyCode === 461) exit(); // Back on Samsung / LG
          if (e.keyCode === 13) go();
        });
        window.addEventListener('online', go);
        go();
      })();
    </script>
  </body>
</html>
