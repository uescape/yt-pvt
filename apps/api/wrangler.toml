name = "curato"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# The TV web app is served from the same origin as the API.
# All TV shells (Tizen, webOS, Android TV, Fire TV) load https://<your-domain>/ so that
# YouTube embeds get a proper https origin/referrer and TV updates ship without store re-review.
[assets]
directory = "../tv/dist"

[[d1_databases]]
binding = "DB"
database_name = "curato"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Leave headroom under the default 10,000 units/day YouTube Data API quota.
QUOTA_DAILY_BUDGET = "9000"
# Max channel searches (100 units each) per household per day.
SEARCHES_PER_HOUSEHOLD_PER_DAY = "15"

# Refresh followed channels and trending charts every 30 minutes.
[triggers]
crons = ["*/30 * * * *"]

# Secrets (set with `wrangler secret put YOUTUBE_API_KEY`):
# - YOUTUBE_API_KEY
